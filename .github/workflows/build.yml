# ──────────────────────────────────────────────────────────────────────────────
# Reusable: Build → Trivy Scan → Push (SINGLE JOB)
#
# Tagging:
#   main branch  → vX.Y.Z  (semantic, driven by conventional commits)
#   other branch → <branch-slug>-<short-sha>
#
# Image pushed to: <DOCKERHUB_USERNAME>/<service_name>:<tag>
# ──────────────────────────────────────────────────────────────────────────────
name: build

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      tag:
        description: "Image tag that was built and pushed"
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Compute semantic version (main only) ─────────────────────────────────
      - name: Get next semantic version
        id: semver
        if: github.ref_name == 'main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          tag_prefix: "v"
          dry_run: true
          default_bump: patch

      # ── Set final image tag ───────────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=${{ steps.semver.outputs.new_tag }}" >> $GITHUB_OUTPUT
          else
            SLUG=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
            SHA=$(echo "${{ github.sha }}" | cut -c1-8)
            echo "tag=${SLUG}-${SHA}" >> $GITHUB_OUTPUT
          fi

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} \
            ${{ inputs.service_path }}

      # ── Trivy security scan (fails on CRITICAL CVEs) ─────────────────────────
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # ── Push ─────────────────────────────────────────────────────────────────
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}

      # ── Tag and push convenience aliases ──────────────────────────────────────
      - name: Tag and push dev-latest / latest
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} \
                       ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest
          else
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} \
                       ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:dev-latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:dev-latest
          fi

      # ── Create git tag on main after a successful push ───────────────────────
      - name: Create git tag
        if: github.ref_name == 'main'
        run: |
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}" || true
          git push origin "${{ steps.tag.outputs.tag }}" || true
